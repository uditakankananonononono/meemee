apiVersion: v1
kind: Namespace
metadata:
  name: meemee
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meemee-data
  namespace: meemee
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 5Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meemee
  namespace: meemee
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: meemee}}
  template:
    metadata: {labels: {app: meemee}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: ghcr.io/uditakankananonononono/meemee:0.108.0
          args: ["meemee", "serve", "--host", "0.0.0.0", "--port", "8787"]
          ports: [{containerPort: 8787}]
          envFrom: [{secretRef: {name: meemee-secrets}}]
          volumeMounts: [{name: data, mountPath: /home/meemee/.meemee}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          readinessProbe: {httpGet: {path: /ready, port: 8787}, initialDelaySeconds: 3}
          livenessProbe: {httpGet: {path: /health, port: 8787}, initialDelaySeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
        - name: worker
          image: ghcr.io/uditakankananonononono/meemee:0.108.0
          args: ["meemee", "worker"]
          envFrom: [{secretRef: {name: meemee-secrets}}]
          volumeMounts: [{name: data, mountPath: /home/meemee/.meemee}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
        - name: webhook-worker
          image: ghcr.io/uditakankananonononono/meemee:0.108.0
          args: ["meemee", "webhook-worker"]
          envFrom: [{secretRef: {name: meemee-secrets}}]
          volumeMounts: [{name: data, mountPath: /home/meemee/.meemee}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: "0.5", memory: 512Mi}
      volumes: [{name: data, persistentVolumeClaim: {claimName: meemee-data}}]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: meemee
spec:
  selector: {app: meemee}
  ports: [{port: 80, targetPort: 8787}]
